<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="description" content="Picksy помогает принимать решения вместе." />
    <title>Picksy — решаем вместе</title>
    <link rel="stylesheet" href="decido.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <div class="shell app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Picksy — главная"><span class="brand-mark">p</span><span>picksy<span class="brand-dot">.</span></span></a>
        <nav class="main-nav" aria-label="Главная навигация">
          <a class="nav-link active" href="#home">Идеи</a>
          <a class="nav-link" href="#polls">Голосование <span class="nav-count" id="poll-count">0</span></a>
          <a class="nav-link" href="#collections">Подборки</a>
        </nav>
        <button class="profile-button" id="profile-button" aria-label="Профиль"><span id="user-avatar">P</span></button>
      </header>
      <main id="view-root"></main>
      <footer><span class="footer-brand"><span class="brand-mark">p</span> picksy</span><span>Места и решения выбирают вместе.</span><span>Сделано с заботой <b>✳</b></span></footer>
      <span class="sr-only" id="page-crumb">Главная</span>
      <span class="sr-only" id="profile-name">Picksy</span>
      <span class="sr-only" id="profile-username">Аккаунт</span>
      <input class="sr-only" id="search-input" type="search" aria-label="Поиск голосований" />
      <button class="sr-only" id="top-create" type="button">Создать голосование</button>
    </div>
    <main id="auth-root" class="auth-root" hidden></main>
    <div class="modal-backdrop hidden" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" id="modal-close" aria-label="Закрыть">×</button><div id="modal-content"></div></section></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
